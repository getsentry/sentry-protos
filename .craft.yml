minVersion: 3.9.0
changelog:
  filePath: CHANGELOG.md
  policy: auto
preReleaseCommand: bash scripts/bump-version.sh
github:
  owner: getsentry
  repo: sentry-protos
artifactProvider:
  name: github
targets:
  - name: github
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi
  - name: crates
requireNames:
  - /^sentry_protos.+-py3-none-any.whl$/
  - /^sentry_protos.+.tar.gz$/
