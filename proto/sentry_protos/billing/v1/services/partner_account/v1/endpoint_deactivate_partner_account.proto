syntax = "proto3";

package sentry_protos.billing.v1.services.partner_account.v1;

// Deactivates the organization's partner account, ending the partner
// relationship and running the partner's deactivation hooks.
message DeactivatePartnerAccountRequest {
  uint64 organization_id = 1;
}

message DeactivatePartnerAccountResponse {
  // True if the organization had an active partner account and it has been
  // deactivated.
  bool deactivated = 1;
}
