syntax = "proto3";

package sentry_protos.billing.v1.services.sales_contract.v1;

import "sentry_protos/billing/v1/services/contract/v1/pricing_config.proto";

// When a sales-led change takes effect. The deal fixes this, so the service does
// not infer it from whether the change is an upgrade or a downgrade.
enum SalesContractTiming {
  SALES_CONTRACT_TIMING_UNSPECIFIED = 0;
  // Apply now and finish out the contract's current term.
  SALES_CONTRACT_TIMING_COTERM = 1;
  // Apply when the current term renews.
  SALES_CONTRACT_TIMING_AT_TERM_END = 2;
}

// Moves an organization's contract onto a sales-negotiated enterprise deal.
message ProvisionSalesContractRequest {
  uint64 organization_id = 1;

  // The enterprise package the contract moves to.
  string package_uid = 2;

  // The contract's month_interval after the change. A coterm cannot change it.
  uint32 month_interval = 3;

  // Reservation overrides, each on a single line item, with the deal's price for
  // the term in reserved_price_cents. Line items not named keep their current
  // configuration.
  repeated sentry_protos.billing.v1.services.contract.v1.UserConfig user_configs = 4;

  SalesContractTiming timing = 5;
}

// Why a provision was not applied. Each one leaves the contract unchanged.
enum SalesContractRejectionReason {
  SALES_CONTRACT_REJECTION_REASON_UNSPECIFIED = 0;
  SALES_CONTRACT_REJECTION_REASON_NO_CONTRACT = 1;
  // Only invoiced contracts can be provisioned for now.
  SALES_CONTRACT_REJECTION_REASON_NOT_INVOICED = 2;
  SALES_CONTRACT_REJECTION_REASON_SPONSORED = 3;
  SALES_CONTRACT_REJECTION_REASON_NOT_ENTERPRISE_PACKAGE = 4;
  SALES_CONTRACT_REJECTION_REASON_INTERVAL_CHANGE_ON_COTERM = 5;
  // A user config sets something other than a single-line-item reservation.
  SALES_CONTRACT_REJECTION_REASON_UNSUPPORTED_USER_CONFIG = 6;
  SALES_CONTRACT_REJECTION_REASON_MISSING_TIMING = 7;
}

message SalesContractRejection {
  SalesContractRejectionReason reason = 1;
  // A message the caller can show to the person who entered the deal.
  string message = 2;
}

message SalesContractApplied {
  // Set when a coterm rolled the contract over and invoiced it.
  optional uint64 invoice_id = 1;
  // True when the contract already matched the request, so nothing was written.
  bool no_op = 2;
}

message ProvisionSalesContractResponse {
  oneof outcome {
    SalesContractApplied applied = 1;
    SalesContractRejection rejection = 2;
  }
}
