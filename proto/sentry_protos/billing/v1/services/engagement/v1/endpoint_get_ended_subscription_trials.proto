syntax = "proto3";

package sentry_protos.billing.v1.services.engagement.v1;

import "sentry_protos/billing/v1/date.proto";
import "sentry_protos/billing/v1/services/engagement/v1/endpoint_get_active_trials.proto";

// Finds the subscription trials of all organizations by their last day.
// A subscription trial has a package_uid. Product trials do not, and are not returned.
message GetEndedSubscriptionTrialsRequest {
  // returns the subscription trials whose end_date is between [start_date, end_date] inclusive
  sentry_protos.billing.v1.Date start_date = 1;
  sentry_protos.billing.v1.Date end_date = 2;
}

message OrganizationTrial {
  uint64 organization_id = 1;
  Trial trial = 2;
}

message GetEndedSubscriptionTrialsResponse {
  repeated OrganizationTrial trials = 1;
}
