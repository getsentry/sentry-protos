syntax = "proto3";

package sentry_protos.billing.v1.services.usage.v1;

import "google/protobuf/timestamp.proto";

// One operation recorded by the LLM proxy that billing charges as Seer usage.
message BilledLlmOperation {
  google.protobuf.Timestamp timestamp = 1;
  string feature = 2;
  // The LLM proxy's stable identifier for this operation.
  string call_id = 3;
  // Cost in 10^-6 cents, rounded as billing records LLM cost.
  uint64 cost_micro_cents = 4;
}

// Resumes a newest-first list strictly after one operation.
message BilledLlmOperationCursor {
  google.protobuf.Timestamp timestamp = 1;
  string call_id = 2;
}

message ListBilledLlmOperationsRequest {
  uint64 organization_id = 1;
  // Required bounds of the half-open interval [start, end).
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  // Resume after this operation. Omit for the first page.
  optional BilledLlmOperationCursor cursor = 4;
  // Defaults to 100 when zero; capped at 1000.
  uint32 limit = 5;
}

message ListBilledLlmOperationsResponse {
  repeated BilledLlmOperation operations = 1;
  // Unset on the last page.
  optional BilledLlmOperationCursor next_cursor = 2;
}
