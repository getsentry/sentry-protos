syntax = "proto3";

package sentry_protos.billing.v1.services.usage.v1;

import "google/protobuf/timestamp.proto";
import "sentry_protos/billing/v1/data_category.proto";
import "sentry_protos/billing/v1/date.proto";
import "sentry_protos/billing/v1/seat_category.proto";
import "sentry_protos/billing/v1/usage_data.proto";

message CategoryUsage {
  DataCategory category = 1;
  UsageData data = 2;
}

// Usage data for a single day.
message DailyUsage {
  Date date = 1;
  repeated CategoryUsage usage = 2;
}

message CategorySeatUsage {
  SeatCategory category = 1;
  uint64 count = 2;
}

// Seat usage data for a single day.
message DailySeatUsage {
  Date date = 1;
  repeated CategorySeatUsage seats = 2;
}

message GetUsageResponse {
  // Usage broken down by day, each containing per-category usage.
  repeated DailyUsage days = 1;
  repeated DailySeatUsage seat_days = 3;

  repeated CategorySeatUsage seats = 2 [deprecated = true]; // DEPRECATED: use seat_days

  // The latest timestamp of usage data included in this response (inclusive
  // — there is at least one row at exactly this timestamp). Callers persist
  // this as the contract's watermark; subsequent queries should resume
  // strictly after this timestamp to avoid double-counting the boundary.
  optional google.protobuf.Timestamp last_usage_ts = 4;
}

// Selects a category, optionally narrowing it without affecting other categories
// or seat usage. With no filter set, the category is unrestricted.
message FilterableDataCategory {
  DataCategory category = 1;

  oneof filter {
    // Only valid for DATA_CATEGORY_SEER_USAGE_MICRO_CENTS and
    // DATA_CATEGORY_BILLABLE_SEER_CREDITS. Consumers must reject other categories.
    SeerFilter seer_filter = 2;
  }
}

message SeerFilter {
  // Exact LLM proxy feature value. Consumers must reject an empty feature_id,
  // including when attribution_id is absent.
  string feature_id = 1;

  // Attribution within the feature and the request's organization/time range.
  // Unset means all attribution for the feature; explicit 0 matches unknown
  // attribution. Signed IDs are preserved without a positive-only restriction.
  optional int64 attribution_id = 2;
}

message GetUsageRequest {
  uint64 organization_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;

  // Category-only selection, supported alongside filterable_categories without
  // deprecation. Consumers must reject requests with both lists nonempty.
  // When both lists are empty, usage for all categories is returned.
  repeated DataCategory categories = 4;

  // Selects exactly these categories, with optional per-category filters.
  // Consumers must reject duplicate categories and DATA_CATEGORY_UNSPECIFIED.
  // Requires consumer support; older services may ignore this field.
  repeated FilterableDataCategory filterable_categories = 5;
}
