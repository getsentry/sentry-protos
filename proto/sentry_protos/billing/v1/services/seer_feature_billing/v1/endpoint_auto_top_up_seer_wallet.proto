syntax = "proto3";

package sentry_protos.billing.v1.services.seer_feature_billing.v1;

import "google/protobuf/timestamp.proto";
import "sentry_protos/billing/v1/common/v1/stripe_verification.proto";

// Buys the organization's configured top-up when its Seer wallet balance is
// below the auto top-up threshold. Safe to repeat: calls with a current_ts in
// the same five-minute window bill at most once.
message AutoTopUpSeerWalletRequest {
  uint64 organization_id = 1;
  google.protobuf.Timestamp current_ts = 2;
}

message AutoTopUpSeerWalletResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // No auto top-up config, or it is disabled.
    OUTCOME_NOT_ENABLED = 1;
    // The current contract has no Seer wallet.
    OUTCOME_NO_WALLET = 2;
    OUTCOME_ABOVE_THRESHOLD = 3;
    // Another top-up for the organization holds the charge lock.
    OUTCOME_LOCKED = 4;
    // The last top-up invoice is unpaid, including when its charge failed.
    // Top-ups resume once the customer pays it.
    OUTCOME_INVOICE_PENDING = 5;
    OUTCOME_BILLED = 6;
  }
  Outcome outcome = 1;
  // Set when outcome is OUTCOME_BILLED or OUTCOME_INVOICE_PENDING. For
  // OUTCOME_INVOICE_PENDING, it is the unpaid invoice that blocks top-ups.
  optional uint64 invoice_id = 2;
  // Whether the top-up invoice was paid. Only meaningful when outcome is
  // OUTCOME_BILLED.
  bool paid = 3;
  // Set when Stripe could not complete the top-up charge.
  string failure_code = 4;
  // Set when the customer must complete a 3D Secure challenge.
  optional sentry_protos.billing.v1.common.v1.StripeVerification verification = 5;
  // Set when outcome is OUTCOME_BILLED or OUTCOME_INVOICE_PENDING. The browser
  // uses this to pay the invoice: it confirms a completed 3D Secure challenge,
  // or pays an unpaid invoice with the payment endpoint.
  optional string invoice_guid = 6;
}
