syntax = "proto3";

package sentry_protos.billing.v1.services.seer_feature_billing.v1;

message CheckSeerCreditsRequest {
  uint64 organization_id = 1;
  // A Seer feature string, as recorded in LLM proxy cost data.
  string feature_id = 2;
  uint64 predicted_credit_usage = 3;
  bool take_lease = 4;
}

message CheckSeerCreditsResponse {
  enum DenialReason {
    DENIAL_REASON_UNSPECIFIED = 0;
    // The wallet balance does not cover the usage so far plus the predicted usage.
    DENIAL_REASON_NOT_ENOUGH_CREDITS = 1;
    // Today's usage plus the predicted usage costs more than the organization's
    // daily spend cap.
    DENIAL_REASON_DAILY_CAP_EXCEEDED = 2;
  }
  bool has_enough_credits = 1;
  optional string lease_id = 2;
  // Why has_enough_credits is false. Unspecified when it is true.
  DenialReason denial_reason = 3;
}
