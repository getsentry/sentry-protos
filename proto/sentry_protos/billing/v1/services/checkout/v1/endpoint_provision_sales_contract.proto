syntax = "proto3";

package sentry_protos.billing.v1.services.checkout.v1;

import "google/protobuf/timestamp.proto";
import "sentry_protos/billing/v1/services/contract/v1/pricing_config.proto";
import "sentry_protos/billing/v1/services/contract/v2/billing_config.proto";
import "sentry_protos/billing/v1/services/contract/v2/sales_config.proto";

// When a sales-led change takes effect. The deal fixes this, so the service does
// not infer it from whether the change is an upgrade or a downgrade.
enum SalesContractTiming {
  SALES_CONTRACT_TIMING_UNSPECIFIED = 0;
  // Apply now and finish out the contract's current term.
  SALES_CONTRACT_TIMING_COTERM = 1;
  // Apply when the current term renews.
  SALES_CONTRACT_TIMING_AT_TERM_END = 2;
}

// Moves an organization's contract onto a sales-negotiated enterprise deal.
message ProvisionSalesContractRequest {
  uint64 organization_id = 1;

  // The enterprise package the contract moves to.
  string package_uid = 2;

  // The contract's month_interval after the change. A coterm cannot change it.
  uint32 month_interval = 3;

  // Reservation overrides, each on a single line item. Line items not named keep
  // their current configuration. The deal's prices go in sales_config, since a
  // UserConfig must not carry a price.
  repeated sentry_protos.billing.v1.services.contract.v1.UserConfig user_configs = 4;

  oneof effective {
    SalesContractTiming timing = 5;
    // Ends the current term on this date and starts a new full term from it, as
    // the deal's start date. Must fall between now and the current term's end.
    google.protobuf.Timestamp new_term_start = 6;
  }

  // How the contract is billed once the deal takes effect: set exactly one of
  // invoiced and credit_card. They are separate fields rather than a oneof
  // because invoiced was published on its own.
  sentry_protos.billing.v1.services.contract.v2.InvoicedConfig invoiced = 7;

  // The deal's prices. When set, it replaces the contract's whole sales config
  // when the deal takes effect, and an empty SalesConfig clears it. Unset keeps
  // the current prices.
  optional sentry_protos.billing.v1.services.contract.v2.SalesConfig sales_config = 8;

  // Bills the deal to the customer's card on file instead of invoicing it.
  sentry_protos.billing.v1.services.contract.v2.CreditCardConfig credit_card = 9;
}

message ProvisionSalesContractResponse {
  // The invoice a coterm created when it rolled the contract over. Unset for a
  // deal staged for renewal, or a coterm the contract already matched.
  optional uint64 invoice_id = 1;
}
