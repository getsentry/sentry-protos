syntax = "proto3";

package sentry_protos.billing.v1.services.checkout.v1;

// Cancels an organization's contract onto the free package.
//
// By default the downgrade is staged for the next rollover, and the
// reservations, PAYG budgets, and soft caps in effect are cleared rather than
// carried onto it. Setting close_account rolls onto free now and closes the
// billing account. Partner deprovision uses that form.
//
// This is separate from ChangeContract because a cancellation strips the
// contract back to the package defaults, which a UserConfig cannot express: it
// can only set a value, and the contract-side Reservation and PAYGBudget carry
// no clear.
message CancelContractRequest {
  uint64 organization_id = 1;

  // Roll onto free now and close the billing account. Unset stages the free
  // downgrade for the next rollover and leaves the account open.
  optional bool close_account = 2;
}

// Empty. A deferred cancellation takes effect at the next rollover and creates
// no invoice. Closing the account rolls over immediately; that close-out
// invoice is not returned here. Callers return an empty 204 either way.
message CancelContractResponse {}
