syntax = "proto3";

package sentry_protos.billing.v1.services.checkout.v1;

// Schedules an organization's contract to end when the current billing period
// closes. The contract is downgraded onto the free package at the next
// rollover, and the reservations, PAYG budgets, and soft caps in effect are
// cleared rather than carried onto it.
//
// This is separate from ChangeContract because a cancellation strips the
// contract back to the package defaults, which a UserConfig cannot express: it
// can only set a value, and the contract-side Reservation and PAYGBudget carry
// no clear.
message CancelContractRequest {
  uint64 organization_id = 1;
}

// Empty. A cancellation takes effect at the next rollover, so it creates no
// invoice, which the caller returns as an empty 204.
message CancelContractResponse {}
