syntax = "proto3";

package sentry_protos.billing.v1.services.checkout.v1;

import "sentry_protos/billing/v1/common/v1/sponsored_type.proto";

// Moves an organization's contract onto the package a sponsorship grants, now,
// in a new term. The closing invoice settles accrued pay-as-you-go usage and
// credits the unused part of the current term; reservations, PAYG budgets,
// soft caps, and add-on activations bought on the paid plan are cleared rather
// than carried onto the sponsored package, which grants its own.
//
// A sponsorship that ends with its term, such as Education, also schedules the
// contract's move onto the free package at the next rollover, the same way
// CancelContract does.
//
// A partner-billed contract cannot be sponsored, nor can a sponsorship the
// latest package catalog grants no package for.
message ApplySponsorshipRequest {
  uint64 organization_id = 1;
  sentry_protos.billing.v1.common.v1.SponsoredType sponsored_type = 2;
}

message ApplySponsorshipResponse {
  // The invoice that closes the contract the sponsorship replaced.
  uint64 invoice_id = 1;
}
