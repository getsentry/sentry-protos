syntax = "proto3";

package sentry_protos.billing.v1.services.customer_presentation.v1;

import "sentry_protos/billing/v1/common/v1/payment_config.proto";
import "sentry_protos/billing/v1/common/v1/pending_change.proto";
import "sentry_protos/billing/v1/date.proto";
import "sentry_protos/billing/v1/services/account_status/v1/account_status.proto";
import "sentry_protos/billing/v1/services/billing_details/v1/billing_details.proto";
import "sentry_protos/billing/v1/services/contract/v2/contract.proto";
import "sentry_protos/billing/v1/services/engagement/v1/endpoint_get_active_trials.proto";
import "sentry_protos/billing/v1/services/engagement/v1/endpoint_get_monetary_grants.proto";
import "sentry_protos/billing/v1/services/engagement/v1/endpoint_get_unit_grants.proto";
import "sentry_protos/billing/v1/services/package/v1/package.proto";
import "sentry_protos/billing/v1/services/rate_card/v1/rate_card.proto";
import "sentry_protos/billing/v1/services/usage_pricer/v1/endpoint_usage_pricer.proto";

// Selects the platform-native customer billing presentation. Detailed fields
// are opt-in because they require extra service calls and may contain sensitive
// billing information that callers must authorize independently.
message GetCustomerPresentationRequest {
  uint64 organization_id = 1;
  // Fetch monetary grants used to calculate account balance in the legacy
  // detailed customer response. List responses omit this extra service call.
  bool include_detailed = 2;
  // Fetch billing contact, address, and tax details. Callers must verify that
  // the requesting actor has billing access before setting this field.
  bool include_billing_details = 3;
  // Fetch Stripe customer and card metadata. Callers must verify that the
  // requesting actor has billing or admin access before setting this field.
  bool include_payment_details = 4;
}

message AvailableTrials {
  // Product trials available for individual line items.
  repeated string line_item_uids = 1;
  // The subscription trial available for a package, when eligible.
  optional string package_uid = 2;
}

// A read-only, platform-native view of the billing concepts needed to present
// a customer.
message GetCustomerPresentationResponse {
  sentry_protos.billing.v1.services.contract.v2.Contract contract = 1;
  sentry_protos.billing.v1.services.package.v1.PackageConfig subscribed_package = 2;
  // The package supplying feature entitlements. This differs from the
  // subscribed package while a package trial is active.
  sentry_protos.billing.v1.services.package.v1.PackageConfig active_package = 3;
  sentry_protos.billing.v1.services.rate_card.v1.RateCard rate_card = 4;
  sentry_protos.billing.v1.services.usage_pricer.v1.UsagePricerResponse priced_usage = 5;
  sentry_protos.billing.v1.services.account_status.v1.AccountStatus account_status = 6;
  sentry_protos.billing.v1.common.v1.StripePaymentData stripe_payment_data = 7;
  sentry_protos.billing.v1.common.v1.PendingChange pending_change = 8;
  sentry_protos.billing.v1.services.package.v1.PackageConfig pending_package = 9;
  repeated sentry_protos.billing.v1.services.engagement.v1.Trial active_trials = 10;
  AvailableTrials available_trials = 11;
  repeated sentry_protos.billing.v1.services.engagement.v1.EffectiveUnitGrant unit_grants = 12;
  sentry_protos.billing.v1.Date last_subscription_trial_end = 13;
  repeated sentry_protos.billing.v1.services.engagement.v1.EffectiveMonetaryGrant monetary_grants = 14;
  sentry_protos.billing.v1.services.billing_details.v1.BillingDetails billing_details = 15;
}
