syntax = "proto3";

package sentry_protos.billing.v1.services.charge.v1;

import "google/protobuf/timestamp.proto";
import "sentry_protos/billing/v1/common/v1/payment_config.proto";
import "sentry_protos/billing/v1/common/v1/stripe_charge.proto";
import "sentry_protos/billing/v1/common/v1/stripe_verification.proto";

// How the charge should be executed against the payment provider.
enum ChargeMethod {
  // Default zero value. Requests with this value must be rejected so
  // that an unset charge_method is never silently treated as an active
  // billing choice.
  CHARGE_METHOD_UNSPECIFIED = 0;
  // Record the charge against our DB models without contacting any
  // external payment provider. Payment is expected to be collected
  // externally.
  CHARGE_METHOD_NONE = 1;
  // Call the Stripe API to bill the customer for this charge.
  CHARGE_METHOD_STRIPE = 2;
  // Record an already-succeeded Stripe charge without calling Stripe.
  CHARGE_METHOD_STRIPE_PAYMENT_INTENT = 3;
  // Submit the invoice to Vercel for collection. Vercel confirms the eventual
  // payment outcome asynchronously through marketplace invoice webhooks.
  CHARGE_METHOD_VERCEL = 4;
}

// A line item in an invoice submitted to Vercel. The amount is signed so
// credits can be represented alongside ordinary charges.
message VercelInvoiceLineItem {
  int64 amount_cents = 1;
  optional string description = 2;
  optional string type = 3;
}

// The provider-specific invoice details required by Vercel. Keeping this data
// on the request lets the charge service submit the invoice without reading
// contract-service state directly.
message VercelInvoiceData {
  string billing_plan_id = 1;
  google.protobuf.Timestamp invoice_date = 2;
  google.protobuf.Timestamp period_start = 3;
  google.protobuf.Timestamp period_end = 4;
  repeated VercelInvoiceLineItem line_items = 5;
}

message CaptureChargeRequest {
  ChargeMethod charge_method = 1;
  uint64 amount_cents = 2;
  optional string description = 3;
  uint64 organization_id = 4;
  google.protobuf.Timestamp current_ts = 5;
  optional string invoice_id = 6;
  optional string invoice_guid = 7;
  optional sentry_protos.billing.v1.common.v1.PaymentConfig payment_config = 8;
  // Required when charge_method is CHARGE_METHOD_STRIPE_PAYMENT_INTENT.
  optional sentry_protos.billing.v1.common.v1.StripeCharge stripe_charge = 9;
  optional string payment_intent = 10;
  // Required when charge_method is CHARGE_METHOD_VERCEL.
  optional VercelInvoiceData vercel_invoice = 11;
}

message CaptureChargeResponse {
  bool paid = 1;
  optional string failure_code = 2;
  // Set when the bank wants the customer to verify the payment.
  sentry_protos.billing.v1.common.v1.StripeVerification verification = 3;
  // The provider accepted the invoice for asynchronous collection, but payment
  // has not been confirmed yet.
  bool awaiting_payment = 4;
}
