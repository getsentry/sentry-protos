syntax = "proto3";

package sentry_protos.billing.v1.services.invoicer.v1;

import "sentry_protos/billing/v1/common/v1/pending_change.proto";
import "sentry_protos/billing/v1/services/contract/v1/invoice.proto";

// Read-only preview of the invoice a contract will next be billed, without
// creating the invoice or charging. Mirrors the assembly the invoicer runs when
// it actually rolls a contract over: renewal (subscription + reserved) line
// items, accrued pay-as-you-go usage, applied account credit (as negative
// balance_change line items), and sales tax.
message PreviewNextInvoiceRequest {
  uint64 contract_id = 1;
  // Overlay this pending change on the contract before pricing the next
  // invoice, as if it were the staged pending change. Used to preview a
  // deferred change (e.g. a downgrade) before it is committed. Unset means
  // price against whatever change is currently staged for the contract.
  optional sentry_protos.billing.v1.common.v1.PendingChange change = 2;
}

message PreviewNextInvoiceResponse {
  // The line items the next invoice would carry, including negative
  // balance_change credit lines and a sales_tax line when applicable.
  repeated sentry_protos.billing.v1.services.contract.v1.InvoiceLineItem line_items = 1;
  // The amount that would be charged: the sum of line_items after applied
  // credit. Never negative (credit is capped at the pre-tax subtotal).
  uint64 amount_billed_cents = 2;
}
