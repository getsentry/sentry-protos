syntax = "proto3";

package sentry_protos.billing.v1.services.events.v1;

import "sentry_protos/billing/v1/services/usage_pricer/v1/endpoint_usage_pricer.proto";

// Published after current contract usage is priced for quota enforcement. Consumers
// can evaluate threshold crossings from the same authoritative pricing result.
message OrganizationUsageEvaluated {
  uint64 contract_id = 1;
  sentry_protos.billing.v1.services.usage_pricer.v1.UsagePricerResponse priced_usage = 2;
}
