syntax = "proto3";

package sentry_protos.billing.v1.services.events.v1;

import "sentry_protos/billing/v1/services/usage_pricer/v1/budget_usage.proto";

// Published after current contract usage is priced for quota enforcement.
message OrganizationUsageEvaluated {
  uint64 contract_id = 1;
  // The normalized utilization values produced by the usage pricer. Consumers
  // can compare used and limit without loading package or contract pricing
  // configuration or assigning special meaning to line item uids.
  repeated sentry_protos.billing.v1.services.usage_pricer.v1.BudgetUsageSummary budget_usage_summaries = 2;
}
