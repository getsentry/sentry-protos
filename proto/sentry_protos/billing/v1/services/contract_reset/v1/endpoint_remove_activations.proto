syntax = "proto3";

package sentry_protos.billing.v1.services.contract_reset.v1;

import "sentry_protos/billing/v1/services/contract/v2/contract.proto";

// Drops add-ons on the contract now. Callers pass the contract those add-ons
// currently sit on: the still-current paid contract for deferred cancel, or
// the newly opened free contract after an immediate rollover.
message RemoveActivationsRequest {
  sentry_protos.billing.v1.services.contract.v2.Contract contract = 1;
}

message RemoveActivationsResponse {}
