syntax = "proto3";

package sentry_protos.billing.v1.services.wallet_top_up_config.v1;

import "sentry_protos/billing/v1/services/wallet_top_up_config/v1/wallet_top_up_config.proto";

message GetTopUpConfigRequest {
  uint64 organization_id = 1;
  string account_id = 2;
}

message GetTopUpConfigResponse {
  // Not set when the account has no config.
  optional TopUpConfig config = 1;
}
