syntax = "proto3";

package sentry_protos.billing.v1.services.projection.v1;

import "sentry_protos/billing/v1/date.proto";
import "sentry_protos/billing/v1/usage_data.proto";

// Estimates what a contract will use for the remainder of its on-demand
// period, so a customer sees a full period rather than a series that stops
// at today.
//
// The estimate is a weighted average of the contract's recent daily usage,
// decayed so that older days count for less. The sample reaches back into
// prior billing periods, because a contract's own period is a poor sample on
// its first days.
message GetProjectedDailyBreakdownRequest {
  // The contract whose remaining on-demand period should be projected.
  uint64 contract_id = 1;

  // The day the projection is made from. Days up to and including this one
  // are sampled; days strictly after it are projected, through the
  // contract's on-demand period end.
  sentry_protos.billing.v1.Date current_date = 2;
}

// One line item's projected per-outcome quantities on a projected date.
message ProjectedLineItemOutcomes {
  // Package line item uid, matching the line items UsagePricer reports
  // actual usage against, so a caller can align the two by uid.
  string line_item_uid = 1;

  // The estimate for each of the seven outcome fields, rounded to whole
  // counts. Two fields are not projected as recorded: quantities rejected
  // for want of quota are counted as accepted, because that is what the
  // customer would have sent, and over_quota itself is projected as zero,
  // so a period that ran over quota does not forecast itself over again.
  sentry_protos.billing.v1.UsageData outcomes = 2;
}

// One projected calendar date.
message ProjectedDailyOutcomes {
  sentry_protos.billing.v1.Date date = 1;

  // Every line item the sample saw, including ones estimated at zero.
  repeated ProjectedLineItemOutcomes line_items = 2;
}

message GetProjectedDailyBreakdownResponse {
  // Projected days in ascending date order, one per day between
  // ``current_date`` (exclusive) and the contract's on-demand period end
  // (inclusive). Empty when the period has already ended.
  //
  // Every projected day repeats the same estimate, because the estimate is a
  // single weighted average per line item rather than a per-day forecast.
  repeated ProjectedDailyOutcomes days = 1;
}
