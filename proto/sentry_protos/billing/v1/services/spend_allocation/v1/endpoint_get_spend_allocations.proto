syntax = "proto3";

package sentry_protos.billing.v1.services.spend_allocation.v1;

import "sentry_protos/billing/v1/date.proto";

// Gets the spend allocations on an organization's current contract, with how
// much each project used this period.
message GetSpendAllocationsRequest {
  uint64 organization_id = 1;
}

message GetSpendAllocationsResponse {
  // The on-demand period the allocations cover. Unset when the organization has
  // no current contract.
  sentry_protos.billing.v1.Date period_start = 1;
  // Exclusive.
  sentry_protos.billing.v1.Date period_end = 2;

  repeated SpendAllocationUsage allocations = 3;
}

// A project's allocation of a line item's reserved volume.
message SpendAllocationUsage {
  uint64 project_id = 1;
  string line_item_uid = 2;

  // Reserved units set aside for the project.
  uint64 allocated = 3;

  // Units the project used this period, in the line item's units. Can exceed
  // allocated.
  uint64 used = 4;
}
