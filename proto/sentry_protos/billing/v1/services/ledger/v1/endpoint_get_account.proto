syntax = "proto3";

package sentry_protos.billing.v1.services.ledger.v1;

import "sentry_protos/billing/v1/services/ledger/v1/ledger.proto";

// Fails with an error when the account does not exist.
message GetAccountRequest {
  uint64 organization_id = 1;
  string account_id = 2;
}

message GetAccountResponse {
  LedgerAccount account = 1;
  // An account has at most one PENDING top-up.
  optional LedgerEntry pending_top_up = 2;
}
