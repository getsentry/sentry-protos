syntax = "proto3";

package sentry_protos.billing.v1.services.package.v1;

import "sentry_protos/billing/v1/services/package/v1/package.proto";

message GetVercelPackagesRequest {}

message GetVercelPackagesResponse {
  // Every package that can be bought through Vercel, that is, every package
  // with vercel_id set.
  repeated PackageConfig package_configs = 1;
}
