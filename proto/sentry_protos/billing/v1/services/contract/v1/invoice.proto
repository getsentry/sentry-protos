syntax = "proto3";

package sentry_protos.billing.v1.services.contract.v1;

import "google/protobuf/timestamp.proto";
import "sentry_protos/billing/v1/common/v1/address.proto";
import "sentry_protos/billing/v1/common/v1/external_billing_provider.proto";

// What paying, or failing to pay, an invoice does to the organization's
// account status. Retries and payment emails apply under every policy.
enum FailurePolicy {
  // Account dunning: a failed payment makes the account past due and, once
  // retries run out, downgrades it or disables on-demand; a successful payment
  // reactivates it. Every invoice written before policies existed has this.
  FAILURE_POLICY_UNSPECIFIED = 0;
  // Payment state never changes account status, in either direction. The
  // service that requested the invoice (client_id) owns the consequences of
  // non-payment and reads the outcome from the invoice, so an invoice with
  // this policy always has a client_id.
  FAILURE_POLICY_RETRY_ONLY = 1;
}

// This is not the same as LineItemDetails, it includes
// items not related to the package such as tax. Each line item may carry an
// optional type that classifies it (e.g. "tax") so consumers can treat it
// specially without inspecting the description.
message InvoiceLineItem {
  // Intentionally not a uint (some line items could be discounts)
  int64 amount_cents = 1;
  optional string description = 2;
  // Optional classifier for the line item, e.g. "tax". Unset for ordinary
  // priced line items.
  optional string type = 3;
  // Caller-defined identifier for what this line bills, set on one-off
  // invoice lines. Opaque to the platform.
  optional string external_id = 4;
}

message Invoice {
  uint64 invoice_id = 1;
  repeated InvoiceLineItem line_items = 2;
  // Not just a sum of line items since there may be credit applied
  uint64 amount_billed = 3;
  uint64 organization_id = 4;
  bool paid = 5;
  google.protobuf.Timestamp date_added = 6;
  string guid = 7;
  bool needs_charged = 8;
  sentry_protos.billing.v1.common.v1.Address address = 9;

  // The customer's tax registration number (e.g. VAT ID)
  optional string tax_number = 10;

  // Whether the tax provider placed the invoice under reverse charge.
  bool is_reverse_charge = 11;

  // Reference to the tax document the provider filed for this invoice.
  // Unset until the invoice's tax transaction is persisted with the
  // provider; reversals are recorded against it.
  optional string tax_transaction_code = 12;

  // The external provider responsible for collecting payment for this invoice. It may be none if this invoice is billed manually (ie enterprise).
  optional sentry_protos.billing.v1.common.v1.ExternalBillingProvider external_billing_provider = 13;

  // The invoice ID assigned by the external billing provider.
  optional string external_invoice_id = 14;

  // When true, this invoice should be omitted from customer-facing receipts
  // (e.g. pre-migration shadow rollovers and the $0 migration stub). Default
  // false means the invoice is visible on receipts.
  bool hide_from_customer_receipts = 15;

  FailurePolicy failure_policy = 16;

  // Caller-supplied key that makes one-off invoice creation safe to retry.
  // Unique per organization and client_id; unset on contract invoices.
  optional string idempotency_key = 17;

  // Identifies the service that requested the invoice, which reads the
  // invoice to learn its outcome and maps idempotency_key back to its own
  // records. Unset on contract invoices.
  optional string client_id = 18;
}
