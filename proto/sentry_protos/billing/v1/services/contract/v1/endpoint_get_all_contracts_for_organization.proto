syntax = "proto3";

package sentry_protos.billing.v1.services.contract.v1;

import "sentry_protos/billing/v1/services/contract/v1/contract.proto";

message GetAllContractsForOrganizationRequest {
  uint64 organization_id = 1;
}

message GetAllContractsForOrganizationResponse {
  // use contract_ids to avoid fetching user parameters unnecessarily
  repeated Contract contracts = 1 [deprecated = true];
  repeated uint64 contract_ids = 2;
}
