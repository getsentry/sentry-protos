syntax = "proto3";

package sentry_protos.billing.v1.services.contract.v1;

// Records the provider-assigned identifier after an externally collected
// invoice has been accepted by its billing provider.
message RecordExternalInvoiceCreatedRequest {
  string invoice_guid = 1;
  uint64 organization_id = 2;
  string external_invoice_id = 3;
}

message RecordExternalInvoiceCreatedResponse {
  bool updated = 1;
}
