syntax = "proto3";

package sentry_protos.billing.v1.services.dynamic_sampling.v1;

// Blended keep-rate for an organization. Derived from the current contract's
// dynamically sampled line item: max(reserved volume, current-period usage)
// mapped onto the sampling table. Unlimited reserved collapses to usage.
message GetBlendedSampleRateRequest {
  uint64 organization_id = 1;
}

message GetBlendedSampleRateResponse {
  // Unset when there is no current contract, or the package has no
  // LINE_ITEM_TAG_IS_DYNAMICALLY_SAMPLED line item. Keep-rates are always
  // greater than zero; 0.0 is not a sentinel.
  optional double sample_rate = 1;
}
