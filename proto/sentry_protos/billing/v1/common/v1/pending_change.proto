syntax = "proto3";

package sentry_protos.billing.v1.common.v1;

import "google/protobuf/empty.proto";
import "sentry_protos/billing/v1/common/v1/pricing_tier.proto";
import "sentry_protos/billing/v1/common/v1/soft_cap_type.proto";
import "sentry_protos/billing/v1/common/v1/sponsored_type.proto";

// A pending change is a deferred subscription change for an organization that
// will apply at the next billing period rollover. Each org has at most one
// pending change at a time. Any field left unset means that aspect of the
// subscription is not being changed.
message PendingChange {
  // The package the subscription will switch to. Unset means the package is
  // not changing.
  optional string package_id = 1;

  // Pending PAYG-budget and reservation overrides, grouped by the set of line
  // items they apply to. This mirrors the UserConfig shape used by the
  // contract pricing config: each entry describes a line-item subset (or "all
  // line items") together with its pending PAYG budget and/or reservation.
  // Shared reserved-budget pools (e.g. Seer covering autofix + scanner +
  // users) are represented as a single PendingUserConfig that lists every
  // line item in the pool.
  repeated PendingUserConfig user_configs = 2;

  // New contract month_interval. Used for downgrades from annual to monthly
  optional uint32 month_interval = 3;

  // Next contract's sponsored_type. SPONSORED_TYPE_UNSPECIFIED clears the
  // sponsorship; an unset field leaves it unchanged.
  optional sentry_protos.billing.v1.common.v1.SponsoredType sponsored_type = 4;

  // The next contract's billing type. Unset leaves it unchanged.
  optional PendingBillingType billing_type = 5;

  // The next contract's payg mode. Set only with PENDING_BILLING_TYPE_INVOICED,
  // since a card-billed contract always charges payg.
  optional PendingPaygMode payg_mode = 6;

  // Replaces the next contract's whole sales config, so an empty
  // PendingSalesConfig clears it. Unset carries the current sales config over
  // unchanged.
  optional PendingSalesConfig sales_config = 7;
}

// Mirrors contract.v2.SalesConfig field for field, since common.v1 cannot
// import contract.v2 without a package cycle. The two must stay
// wire-compatible.
message PendingSalesConfig {
  repeated PendingSalesLineItemPricing pricing = 1;
}

// Mirrors contract.v2.SalesLineItemPricing.
message PendingSalesLineItemPricing {
  string line_item_uid = 1;
  optional uint64 reserved_price_cents = 2;
  optional sentry_protos.billing.v1.common.v1.TieredPricingRate payg_rate = 3;
}

// The billing type a pending change moves the next contract onto.
enum PendingBillingType {
  PENDING_BILLING_TYPE_UNSPECIFIED = 0;

  // Billed directly by us, on a card the customer manages.
  PENDING_BILLING_TYPE_CREDIT_CARD = 1;

  // Invoiced by us, under a sales-negotiated agreement.
  PENDING_BILLING_TYPE_INVOICED = 2;
}

// Whether an invoiced contract may incur payg, and who bills it.
enum PendingPaygMode {
  PENDING_PAYG_MODE_UNSPECIFIED = 0;

  // The org may not incur payg at all.
  PENDING_PAYG_MODE_NONE = 1;

  // The org incurs payg, but it is billed outside the platform.
  PENDING_PAYG_MODE_MANUAL = 2;

  // We charge payg spend ourselves.
  PENDING_PAYG_MODE_CHARGED = 3;
}

// Pending overrides for a set of line items. payg_budget and reservation are
// each independently optional - either, both, or neither may be set on a
// given config.
message PendingUserConfig {
  // Pending PAYG budget for the covered line items. Unset means the PAYG
  // budget is not changing.
  optional PAYGBudget payg_budget = 1;

  // Pending reservation (price and unit count) for the covered line items.
  // Unset means the reservation is not changing.
  optional Reservation reservation = 2;

  // The line items this config applies to.
  oneof line_items {
    // Explicit list of line item uids (e.g. one line item, or multiple line
    // items that share a reserved-budget pool).
    LineItemUids specific_items = 3;

    // Sentinel meaning "all line items on the package." Used for top-level
    // shared PAYG budgets.
    google.protobuf.Empty all_items = 4;
  }

  // Pending soft-cap override.
  optional SoftCap soft_cap = 5;
}

message PAYGBudget {
  uint64 budget_cents = 1;
  // Whether the next billing cycle should clear the Contract's existing UserParameter
  bool clear_user_parameter = 2;
}

message Reservation {
  uint64 reserved_price_cents = 1;
  oneof reserved_units {
    bool is_unlimited = 2;
    uint64 num_reserved_units = 3;
  }
  // Whether the next billing cycle should clear the Contract's existing UserParameter
  bool clear_user_parameter = 4;
}

// A pending soft-cap override.
message SoftCap {
  SoftCapType type = 1;
  bool clear_user_parameter = 2;
}

message LineItemUids {
  repeated string uids = 1;
}
