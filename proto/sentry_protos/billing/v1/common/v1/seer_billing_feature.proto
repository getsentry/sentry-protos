syntax = "proto3";

package sentry_protos.billing.v1.common.v1;

// Identifies the feature responsible for Seer usage, independently of the
// program executing the work. Whether usage is chargeable is billing policy.
// Set by trusted server entrypoints; persisted attribution is preserved for
// subsequent operations on the same run.
// For concrete values, the billing/proxy label is the lowercase enum name
// with the SEER_BILLING_FEATURE_ prefix removed.
enum SeerBillingFeature {
  // Missing attribution, not a real feature or a billing exemption.
  // New runs must provide a concrete feature. Legacy runs need an explicit
  // compatibility fallback in the consuming application.
  SEER_BILLING_FEATURE_UNSPECIFIED = 0;

  SEER_BILLING_FEATURE_AUTOFIX_WEB = 1;
  SEER_BILLING_FEATURE_AUTOFIX_HEADLESS = 2;
  SEER_BILLING_FEATURE_AUTOFIX_INTEGRATIONS = 3;
  SEER_BILLING_FEATURE_AUTOFIX_AGENTIC_TRIAGE = 4;
  SEER_BILLING_FEATURE_AUTOFIX_POST_PROCESS = 5;

  SEER_BILLING_FEATURE_SEER_AGENT = 6;
  SEER_BILLING_FEATURE_SEER_AGENT_SLACK = 7;
  SEER_BILLING_FEATURE_SEER_AGENT_SUGGESTIONS = 8;
  SEER_BILLING_FEATURE_AGENTIC_TRIAGE = 9;
  SEER_BILLING_FEATURE_RUN_QUESTIONS = 10;
  SEER_BILLING_FEATURE_INVESTIGATIONS = 11;

  SEER_BILLING_FEATURE_SMART_ASSIGNMENT = 12;
  SEER_BILLING_FEATURE_MONITOR_CLEANUP = 13;
  SEER_BILLING_FEATURE_IMPACT_ASSESSMENT = 14;
  SEER_BILLING_FEATURE_DASHBOARD_GENERATION = 15;
  SEER_BILLING_FEATURE_CONTEXT_INDEXING = 16;
  SEER_BILLING_FEATURE_ISSUE_SUMMARY = 17;
  SEER_BILLING_FEATURE_FIXABILITY = 18;
  SEER_BILLING_FEATURE_USER_FEEDBACK = 19;
  SEER_BILLING_FEATURE_REPLAY_SUMMARY = 20;
  SEER_BILLING_FEATURE_ISSUE_VIEW_TITLE = 21;
  SEER_BILLING_FEATURE_EXTERNAL_ISSUE_DETAILS = 22;
  SEER_BILLING_FEATURE_UPTIME_ASSERTIONS = 23;
  SEER_BILLING_FEATURE_ISSUE_DETECTION = 24;
  SEER_BILLING_FEATURE_LOW_VALUE_SPANS = 25;
  SEER_BILLING_FEATURE_MALICIOUS_ISSUE_DETECTION = 26;

  SEER_BILLING_FEATURE_CODE_REVIEW = 27;
  SEER_BILLING_FEATURE_PR_METRICS = 28;
  SEER_BILLING_FEATURE_ASSISTED_QUERY = 29;
  SEER_BILLING_FEATURE_EVALS = 30;
  SEER_BILLING_FEATURE_AI_MONITORING = 31;
  SEER_BILLING_FEATURE_INBOUND_FILTERS = 32;
  SEER_BILLING_FEATURE_SEVERITY = 33;
  SEER_BILLING_FEATURE_GROUPING = 34;
  SEER_BILLING_FEATURE_MODEL_TRAINING = 35;
}
