syntax = "proto3";

package sentry_protos.billing.v1.common.v1;

// Product entitlements available to an organization.
message ProductEntitlements {
  repeated ProductEntitlement entitlements = 1;
}

// An entitlement granting access to a product capability.
enum ProductEntitlement {
  PRODUCT_ENTITLEMENT_UNSPECIFIED = 0;
  PRODUCT_ENTITLEMENT_SEER_USAGE = 1;
}
